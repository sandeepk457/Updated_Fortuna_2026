<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You – Fortuna Global Supply Chain Systems</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #C8102E, #005F99);
      color: #fff;
      font-family: "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    .thank-card {
      background: rgba(255,255,255,0.1);
      padding: 40px 50px;
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.25);
      backdrop-filter: blur(6px);
      max-width: 600px;
      animation: fadeIn 1s ease;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 700;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    a.btn {
      background: linear-gradient(135deg, #b30000, #0047AB);
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      animation: fortunaPulse 4s infinite alternate;
      transition: transform 0.3s ease;
    }

    a.btn:hover {
      transform: scale(1.05);
    }

    @keyframes fortunaPulse {
      0% { background: linear-gradient(135deg, #b30000, #0047AB); }
      50% { background: linear-gradient(135deg, #ff3333, #007bff); }
      100% { background: linear-gradient(135deg, #b30000, #0047AB); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    img.logo {
      width: 140px;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>
  <div class="thank-card">
    <img src="assets/img/favicon.png" alt="Fortuna Logo" class="logo"/>
    <h1>Thank You!</h1>
    <p>Your message has been successfully sent to </p>
      <p><strong>"Fortuna Global Supply Chain Systems"</strong>.<br/>
      <p> Our team will get back to you shortly with the right assistance.</p>
    <a href="index.html" class="btn">← Back to Home</a>
  </div>
</body>
</html>
